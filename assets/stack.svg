<title id="title">Core stack &amp; research direction</title><desc id="desc">Control: PLC, LabVIEW, robotics, vision. Software: Python, C++, Qt, React, Node.js, SQL. AI integration: local LLMs, tool calling, rule-based validation. Research interest: knowledge-guided manufacturing AI, combining process data with engineering constraints.</desc>
