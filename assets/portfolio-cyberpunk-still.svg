<svg xmlns="http://www.w3.org/2000/svg" width="760" height="204" viewBox="0 0 760 204" role="img" aria-labelledby="title desc">
  <title id="title">Explore my work — The Factory Road</title>
  <desc id="desc">Smart Factory, Robotics and AI. Floating neon panels, a scanning light and a luminous core invite you to explore my portfolio.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#100e23"/><stop offset="1" stop-color="#060911"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#d224ff" stop-opacity=".18"/><stop offset="1" stop-color="#d224ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="base" x2=".8" y2="1"><stop stop-color="#20305b"/><stop offset="1" stop-color="#111833"/></linearGradient>
    <linearGradient id="side"><stop stop-color="#111527"/><stop offset=".5" stop-color="#1c2c51"/><stop offset=".5" stop-color="#090d22"/><stop offset="1" stop-color="#1c1c3b"/></linearGradient>
    <linearGradient id="panel" x2=".8" y2="1"><stop stop-color="#634ca8"/><stop offset="1" stop-color="#291b55"/></linearGradient>
    <linearGradient id="upper" x2=".7" y2="1"><stop stop-color="#ac64e8"/><stop offset="1" stop-color="#422b8d"/></linearGradient>
    <linearGradient id="upper-side"><stop stop-color="#6535a4"/><stop offset=".5" stop-color="#844cd1"/><stop offset=".5" stop-color="#331e66"/><stop offset="1" stop-color="#553092"/></linearGradient>
    <linearGradient id="cube-left" x2="0" y2="1"><stop stop-color="#bcffff"/><stop offset="1" stop-color="#25b6d9"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="scan-fade" x2="0" y2="1"><stop stop-color="#31eafa" stop-opacity="0"/><stop offset="1" stop-color="#31eafa" stop-opacity=".1"/></linearGradient>
    <clipPath id="scan-clip"><path d="M28 89L108 49L188 89L188 155L108 195L28 155Z"/></clipPath>
  </defs>
